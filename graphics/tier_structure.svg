  <text x="216" y="337" font-size="22" font-weight="700" fill="#1C1816" text-anchor="middle">45%</text>
  <text x="364" y="337" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">$250,000</text>
  <text x="510" y="337" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">20</text>
  <text x="648" y="337" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">12</text>

