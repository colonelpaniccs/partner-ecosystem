  <text x="216" y="501" font-size="22" font-weight="700" fill="#1C1816" text-anchor="middle">30%</text>
  <text x="364" y="501" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">$20,000</text>
  <text x="510" y="501" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">5</text>
  <text x="648" y="501" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">4</text>

  <!-- L1 (20%): 40% fill -->
  <rect x="84" y="540" width="628" height="72" rx="12" fill="#E8F3EA"/>
  <rect x="84" y="540" width="251" height="72" rx="12" fill="#A8D5B0"/>
  <rect x="100" y="554" width="40" height="40" rx="8" fill="#FFFFFF"/>
  <text x="120" y="579" font-size="14" font-weight="700" fill="#1C1816" text-anchor="middle">L1</text>
  <text x="216" y="583" font-size="22" font-weight="700" fill="#1C1816" text-anchor="middle">20%</text>
  <text x="364" y="583" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">$0</text>
  <text x="510" y="583" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">2</text>
  <text x="648" y="583" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">2</text>

  <!-- ================= CONSULTANTS ================= -->
