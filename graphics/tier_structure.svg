  <text x="84" y="792" font-size="13" fill="#1C1816">Level 5</text>
  <circle cx="232" cy="786" r="10" fill="#FFFFFF" stroke="#E4DED8"/>
  <text x="232" y="791" font-size="16" font-weight="700" fill="#ef9871" text-anchor="middle">+</text>
  <text x="84" y="820" font-size="13" fill="#1C1816">Level 4</text>
  <circle cx="232" cy="814" r="10" fill="#FFFFFF" stroke="#E4DED8"/>
  <text x="232" y="819" font-size="16" font-weight="700" fill="#ef9871" text-anchor="middle">+</text>
  <text x="84" y="848" font-size="13" fill="#1C1816">Level 3</text>
  <circle cx="232" cy="842" r="10" fill="#FFFFFF" stroke="#E4DED8"/>
  <text x="232" y="847" font-size="16" font-weight="700" fill="#ef9871" text-anchor="middle">+</text>
  <text x="84" y="876" font-size="13" fill="#1C1816">Level 2</text>
  <circle cx="232" cy="870" r="10" fill="#FFFFFF" stroke="#E4DED8"/>
  <text x="232" y="875" font-size="16" font-weight="700" fill="#ef9871" text-anchor="middle">+</text>
  <text x="84" y="904" font-size="13" fill="#1C1816">Level 1</text>
  <circle cx="232" cy="898" r="10" fill="#FFFFFF" stroke="#E4DED8"/>
  <text x="232" y="903" font-size="16" font-weight="700" fill="#ef9871" text-anchor="middle">+</text>

  <!-- Divider -->
  <line x1="370" y1="752" x2="370" y2="922" stroke="#E4DED8" stroke-dasharray="4 4"/>

  <!-- Consultants column -->
  <text x="406" y="764" font-size="9.5" letter-spacing="1.4" fill="#6b42a8">CONSULTANTS</text>
  <text x="406" y="792" font-size="13" fill="#1C1816">Prime</text>
  <circle cx="528" cy="786" r="10" fill="#FFFFFF" stroke="#E4DED8"/>
  <text x="528" y="791" font-size="16" font-weight="700" fill="#ef9871" text-anchor="middle">+</text>
  <text x="406" y="820" font-size="13" fill="#1C1816">Consultant</text>
  <circle cx="528" cy="814" r="10" fill="#FFFFFF" stroke="#E4DED8"/>
  <text x="528" y="819" font-size="16" font-weight="700" fill="#ef9871" text-anchor="middle">+</text>
  <text x="406" y="848" font-size="13" fill="#1C1816">Reference</text>
  <text x="528" y="848" font-size="13" fill="#A79E97" text-anchor="middle">none</text>

  <!-- Divider -->
  <line x1="660" y1="752" x2="660" y2="922" stroke="#E4DED8" stroke-dasharray="4 4"/>

  <!-- Prepaid Package Details -->
  <text x="696" y="764" font-size="9.5" letter-spacing="1.4" fill="#6B625C">PREPAID PACKAGE DETAILS</text>
  <text x="696" y="792" font-size="12" fill="#6B625C">Prepaid packages are required for all Integrators and for</text>
  <text x="696" y="812" font-size="12" fill="#6B625C">Consultants at the Consultant and Prime levels.</text>
  <text x="696" y="842" font-size="12" fill="#6B625C">The package balance applies at 2&#215; credit toward training,</text>
  <text x="696" y="862" font-size="12" fill="#6B625C">certification, consultation hours, and non-resale licenses.</text>

  <!-- ================= CALIBRATION ================= -->
  <line x1="48" y1="950" x2="752" y2="950" stroke="#E4DED8"/>
  <text x="48" y="972" font-size="10" font-weight="700" letter-spacing="1.8" fill="#ef9871">CALIBRATION</text>
  <text x="48" y="997" font-size="12" fill="#A79E97">Margins, revenue thresholds, and bench requirements scale together. Your product's economics, training and certification requirements will determine where the structure lands.</text>
</svg>
