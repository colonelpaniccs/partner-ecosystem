  <text x="932" y="200" font-size="8.5" letter-spacing="0.8" fill="#A79E97" text-anchor="middle">PARTNER MARGIN</text>
  <text x="1062" y="200" font-size="8.5" letter-spacing="0.8" fill="#A79E97" text-anchor="middle">ANNUAL REVENUE</text>

