  <text x="932" y="489" font-size="22" font-weight="700" fill="#1C1816" text-anchor="middle">10%</text>
  <text x="1062" y="486" font-size="13" fill="#6B625C" text-anchor="middle">None</text>

  <text x="812" y="560" font-size="11.5" fill="#6B625C">Consultants are not required to run marketing activities.</text>
  <text x="812" y="578" font-size="11.5" fill="#6B625C">Revenue requirements only apply at the Prime tier.</text>

  <!-- ================= PREPAID PACKAGES ================= -->
  <rect x="48" y="674" width="1104" height="260" rx="16" fill="#7BAFD4"/>
  <path d="M48,679 L1152,679 L1152,918 A16,16 0 0,1 1136,934 L64,934 A16,16 0 0,1 48,918 Z" fill="#FFFFFF"/>
  <rect x="48" y="674" width="1104" height="260" rx="16" fill="none" stroke="#E4DED8"/>
