  <rect x="100" y="226" width="40" height="40" rx="8" fill="#FFFFFF"/>
  <text x="120" y="251" font-size="14" font-weight="700" fill="#1C1816" text-anchor="middle">L5</text>
  <text x="216" y="255" font-size="22" font-weight="700" fill="#1C1816" text-anchor="middle">50%</text>
  <text x="364" y="255" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">$1,000,000</text>
  <text x="510" y="255" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">30</text>
  <text x="648" y="255" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">12</text>

  <!-- L4 (45%): 90% fill -->
