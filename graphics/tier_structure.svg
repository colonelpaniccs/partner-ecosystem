  <text x="932" y="269" font-size="22" font-weight="700" fill="#1C1816" text-anchor="middle">30%</text>
  <text x="1062" y="266" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">$20,000</text>

  <!-- Consultant (20%): partial fill, height=100 -->
  <rect x="812" y="322" width="304" height="100" rx="12" fill="#EDE8F5"/>
  <rect x="812" y="322" width="204" height="100" rx="12" fill="#C8B8E8"/>
  <text x="828" y="354" font-size="13" font-weight="700" fill="#1C1816">Consultant</text>
  <text x="932" y="379" font-size="22" font-weight="700" fill="#1C1816" text-anchor="middle">20%</text>
  <text x="1062" y="376" font-size="13" fill="#6B625C" text-anchor="middle">None</text>

