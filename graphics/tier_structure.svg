<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1200" height="1040" fill="#FEFAF3"/>

