  <rect x="48" y="108" width="700" height="548" rx="16" fill="none" stroke="#E4DED8"/>
  <text x="84" y="160" font-size="12" font-weight="700" letter-spacing="2.4" fill="#89bd93">INTEGRATORS</text>
  <line x1="84" y1="176" x2="712" y2="176" stroke="#E4DED8"/>

  <!-- Integrator column headers -->
