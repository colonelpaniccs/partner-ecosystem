  <text x="648" y="419" font-size="13" font-weight="700" fill="#1C1816" text-anchor="middle">6</text>

  <!-- L2 (30%): 60% fill -->
  <rect x="84" y="458" width="628" height="72" rx="12" fill="#E8F3EA"/>
  <rect x="84" y="458" width="377" height="72" rx="12" fill="#A8D5B0"/>
  <rect x="100" y="472" width="40" height="40" rx="8" fill="#FFFFFF"/>
